<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POO 4B · Cartas</title>
<style>
:root{--bg:#f4f1ea;--ink:#1d1d1f;--mut:#6b6b70;--line:#d9d4c7;--bl-f:#fff;--bl-b:#fbfaf6;--ne-f:#1f1f23;--ne-b:#2a2a30;--ne-ink:#f2f2f2;--te-f:#e8eefc;--te-b:#f4f7ff;--acc:#4f46e5}
@media(prefers-color-scheme:dark){:root{--bg:#141417;--ink:#ececee;--mut:#9a9aa2;--line:#2c2c32;--bl-f:#2b2b31;--bl-b:#232328;--ne-f:#0b0b0d;--ne-b:#17171a;--te-f:#1f2640;--te-b:#191e33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:28px 16px 8px;max-width:1400px;margin:auto}
h1{margin:0;font-size:22px}
header p{margin:4px 0 0;color:var(--mut);font-size:14px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;max-width:none}
nav a,nav button{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);text-decoration:none;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
nav .sp{flex:1}
main{max-width:1400px;margin:auto;padding:0 16px 60px}
section.cat{padding-top:28px}
section.cat>h2{font-size:20px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.dot.b{background:#fff}.dot.n{background:#111}.dot.t{background:#8aa4ee;border-color:#4f46e5}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 0 10px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{display:flex;perspective:1000px;cursor:pointer;outline:none}
.inner{flex:1;display:grid;transition:transform .5s;transform-style:preserve-3d;position:relative}
.card.flip .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);padding:16px;min-height:150px;display:flex;flex-direction:column}
.front{align-items:center;justify-content:center;text-align:center;gap:10px;font-weight:600;font-size:16px}
.back{transform:rotateY(180deg);gap:8px;font-size:13.5px}
.num{font-size:12px;font-weight:700;opacity:.55}
.card:focus-visible .face{box-shadow:0 0 0 2px var(--acc)}
.blancas .front{background:var(--bl-f)}.blancas .back{background:var(--bl-b)}
.negras .front{background:var(--ne-f);color:var(--ne-ink);border-color:#000}.negras .back{background:var(--ne-b);color:var(--ne-ink);border-color:#000}
.teoria .front{background:var(--te-f)}.teoria .back{background:var(--te-b)}
.back h4{margin:0;font-size:14px}
.back b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.6;margin-top:4px}
.back span{white-space:pre-wrap;word-break:break-word}
.hint{font-size:11px;opacity:.45;font-weight:400}
@media(prefers-reduced-motion:reduce){.inner{transition:none}}
@media(max-width:480px){.grid{grid-template-columns:1fr 1fr;gap:10px}.face{padding:12px}}
</style>
</head>
<body>
<header>
<h1>POO · 4.º Bimestre · Examen de cartas · App Instagram</h1>
<p>Click en una carta para darla vuelta.</p>
</header>
<nav>
<a href="#blancas">Blancas</a><a href="#negras">Negras</a><a href="#teoria">Teoría</a>
<span class="sp"></span>
<button id="all">Mostrar todas</button><button id="none">Ocultar todas</button>
</nav>
<main id="app"></main>

,"seccion":"Interacción entre usuarios","bd":"Tabla colaboradores_post (post_id, usuario_id)","api":"El post aparece en GET /usuarios/{id}/posts del autor y del colaborador; máximo 2 colaboradores (400)","front":"\"@autor y @colaborador\" en el encabezado del post"},{"numero":68,"titulo":"Fotos en las que te etiquetaron","seccion":"Interacción entre usuarios","bd":"Tabla etiquetas_post (post_id, usuario_id)","api":"POST /posts/{id}/etiquetas y GET /usuarios/{id}/etiquetado","front":"Pestaña \"Etiquetado\" en el Perfil"},{"numero":69,"titulo":"Silenciar usuarios","seccion":"Interacción entre usuarios","bd":"Tabla silenciados","api":"El Feed no trae sus posts, pero su perfil se sigue viendo","front":"Opción \"Silenciar\" en un menú de tres puntos del post"},{"numero":70,"titulo":"Reportes con motivo","seccion":"Interacción entre usuarios","bd":"Tabla reportes (usuario_id, post_id, motivo)","api":"1 reporte por usuario y post (409); con 3 reportes el post se oculta","front":"Modal con los motivos: spam, violencia, falso, otro"},{"numero":71,"titulo":"A quién seguir","seccion":"Interacción entre usuarios","bd":"Tabla seguidores","api":"GET /usuarios/{id}/sugerencias: usuarios seguidos por tus seguidos que vos no seguís","front":"Panel \"Sugerencias para vos\" con botón \"Seguir\""},{"numero":72,"titulo":"Compartir post por mensaje","seccion":"Interacción entre usuarios","bd":"Tabla mensajes con post_id INT NULL REFERENCES posts(id)","api":"POST /mensajes acepta un postId y 400 si el post no existe","front":"Botón \"Enviar a...\" y miniatura del post dentro del chat"},{"numero":73,"titulo":"Tu actividad","seccion":"Interacción entre usuarios","bd":"Tabla likes con fecha","api":"GET /usuarios/{id}/actividad con los últimos 20 likes dados","front":"Lista \"Te gustó la foto de @x\" con la fecha"},{"numero":74,"titulo":"Desactivar comentarios","seccion":"Interacción entre usuarios","bd":"Tabla comentarios y columna comentarios_activos en posts","api":"Comentar un post cerrado lanza ComentariosDesactivadosException → 403","front":"Switch para el autor; si están cerrados, ocultar el input y mostrar \"Comentarios desactivados\""},{"numero":75,"titulo":"Palabras prohibidas","seccion":"Interacción entre usuarios","bd":"Tabla palabras_prohibidas","api":"Si un comentario o descripción tiene una, lanzar PalabraProhibidaException → 400","front":"Alert de MUI con el error y página de admin para agregar palabras"},{"numero":76,"titulo":"Carrusel de fotos","seccion":"Funciones nuevas","bd":"Tabla fotos (id, post_id, url, orden)","api":"POST /posts recibe una lista de URLs; más de 10 lanza CarruselExcedidoException (400); GET devuelve List\u003cstring> Fotos","front":"Flechas ← → y puntitos de posición (con useState o Swiper)"},{"numero":77,"titulo":"Historias de 24 horas","seccion":"Funciones nuevas","bd":"Tabla historias (id, usuario_id, imagen_url, creada)","api":"POST /historias; GET /historias solo trae las de menos de 24 h","front":"Círculos arriba del Feed y visor a pantalla completa que avanza cada 5 segundos"},{"numero":78,"titulo":"Historias vistas","seccion":"Funciones nuevas","bd":"Tablas historias y vistas_historia (historia_id, usuario_id)","api":"POST /historias/{id}/vista sin duplicados; GET devuelve \"vista: true/false\" y cantidad","front":"Anillo de color si no la vio y gris si ya la vio; \"Visto por X\" para el autor"},{"numero":79,"titulo":"Historias destacadas","seccion":"Funciones nuevas","bd":"Tablas destacadas (id, usuario_id, titulo) y destacada_historias","api":"POST /destacadas con una lista de historias propias (403 si alguna es de otro)","front":"Fila de círculos con título en el Perfil"},{"numero":80,"titulo":"Hashtags","seccion":"Funciones nuevas","bd":"Tablas hashtags (id, nombre UNIQUE) y post_hashtags","api":"Al crear un post, extraer los #tags de la descripción y guardarlos; GET /hashtags/{tag}/posts","front":"#tags como links y página /hashtag/:tag con la grilla de posts"},{"numero":81,"titulo":"Tendencias","seccion":"Funciones nuevas","bd":"Tablas de hashtags (crearlas si no existen)","api":"GET /hashtags/top: los 5 más usados en los últimos 7 días (GROUP BY + ORDER BY COUNT)","front":"Panel lateral \"Tendencias\" con la cantidad de posts de cada uno"},{"numero":82,"titulo":"Sesiones con token","seccion":"Funciones nuevas","bd":"Tabla sesiones (token UUID, usuario_id, expira)","api":"El login crea un token; crear y borrar posts exigen el header Authorization (401 si falta o venció); POST /logout borra la sesión","front":"Interceptor de Axios que manda el token y botón \"Cerrar sesión\""},{"numero":83,"titulo":"Contraseñas seguras","seccion":"Funciones nuevas","bd":"Ampliar contrasena a 255 y borrar las contraseñas en texto plano","api":"Hashear con BCrypt; ContrasenaDebilException (400) si no tiene 8 caracteres, un número y una mayúscula","front":"Barra de fuerza de contraseña (débil, media, fuerte) en Register"},{"numero":84,"titulo":"Recuperar con código","seccion":"Funciones nuevas","bd":"Tabla codigos_recuperacion (usuario_id, codigo, expira)","api":"POST /recuperar genera un código de 6 dígitos (se muestra en la consola del back); POST /recuperar/confirmar lo valida; 400 si venció a los 10 min","front":"Flujo en dos pantallas: email y después código + contraseña nueva"},{"numero":85,"titulo":"Colecciones","seccion":"Funciones nuevas","bd":"Tablas colecciones (id, usuario_id, nombre) y coleccion_posts","api":"POST /colecciones, POST /colecciones/{id}/posts; 409 si el post ya está en esa colección","front":"Al guardar, elegir colección; en el Perfil, una carpeta por colección"},{"numero":86,"titulo":"Reels","seccion":"Funciones nuevas","bd":"Tabla reels (id, usuario_id, video_url, duracion_segundos)","api":"Clase abstracta Publicacion con PostFoto y Reel; GET /publicaciones devuelve ambos mezclados con su tipo; máximo 90 segundos (400)","front":"Mostrar \u003cimg> o \u003cvideo autoplay muted loop> según el tipo"},{"numero":87,"titulo":"Estadísticas del perfil","seccion":"Funciones nuevas","bd":"Tabla likes","api":"GET /usuarios/{id}/estadisticas: posts, likes recibidos, promedio por post y post más likeado","front":"Tarjetas con los números en el Perfil propio"},{"numero":88,"titulo":"Feed paginado","seccion":"Funciones nuevas","bd":"CREATE INDEX sobre posts(fecha)","api":"GET /posts?pagina=&cantidad= con LIMIT y OFFSET y el total de páginas","front":"Botón \"Cargar más\" o scroll infinito que agrega posts sin perder los anteriores"},{"numero":89,"titulo":"Búsqueda global","seccion":"Funciones nuevas","bd":"Índices sobre usuarios(nombre) y posts(descripcion)","api":"GET /buscar?q= devuelve usuarios y posts con ILIKE; 400 si q tiene menos de 2 letras","front":"Página con pestañas \"Cuentas\" y \"Posts\" que busca mientras se escribe"},{"numero":90,"titulo":"Historial de búsquedas","seccion":"Funciones nuevas","bd":"Tabla busquedas (usuario_id, texto, fecha)","api":"Guardar cada búsqueda; GET las últimas 5 sin repetir; DELETE una o todas","front":"\"Recientes\" debajo del buscador con una ✕ para borrar"},{"numero":91,"titulo":"Registro de actividad (log)","seccion":"Funciones nuevas","bd":"Tabla logs (usuario_id, accion, fecha)","api":"Cada alta y baja de post inserta un log; GET /admin/logs solo para rol admin (403)","front":"Página de admin con la tabla de logs y filtro por acción"},{"numero":92,"titulo":"Panel de administración","seccion":"Funciones nuevas","bd":"Columnas rol y baneado en usuarios","api":"GET /admin/usuarios con cantidad de posts; PUT /admin/usuarios/{id}/banear; el baneado recibe 403 al loguearse","front":"Página /admin protegida con botones \"Banear\" y \"Desbanear\""},{"numero":93,"titulo":"Límite de posts por día","seccion":"Funciones nuevas","bd":"Columna plan (free o premium) en usuarios","api":"Free puede publicar 5 posts por día; si no, LimitePublicacionesException → 429; premium sin límite","front":"\"Te quedan X publicaciones hoy\" en \"Nuevo post\""},{"numero":94,"titulo":"Historial de ediciones","seccion":"Funciones nuevas","bd":"Tabla ediciones_post (post_id, descripcion_anterior, fecha)","api":"PUT /posts/{id} guarda la descripción vieja antes de cambiarla; GET /posts/{id}/ediciones","front":"\"(editado)\" clickeable que abre la lista de versiones"},{"numero":95,"titulo":"Papelera","seccion":"Funciones nuevas","bd":"Columna eliminado_en TIMESTAMP NULL en posts","api":"DELETE pasa a ser lógico; GET /usuarios/{id}/papelera y PUT /posts/{id}/restaurar; no se restaura si pasaron 30 días (400)","front":"Pestaña \"Papelera\" con botón \"Restaurar\" y días restantes"},{"numero":96,"titulo":"Insignias","seccion":"Funciones nuevas","bd":"Tablas insignias y usuario_insignias","api":"Al publicar el 1.º y el 10.º post se otorga la insignia sin duplicarla","front":"Insignias en el Perfil y Alert de MUI \"¡Ganaste una insignia!\""},{"numero":97,"titulo":"Eventos","seccion":"Funciones nuevas","bd":"Tablas eventos (titulo, fecha, lugar, cupo) y asistentes","api":"POST /eventos/{id}/asistir; EventoFinalizadoException si ya pasó y CupoLlenoException si no hay lugar","front":"Lista de eventos con botón \"Voy\" y lugares disponibles"},{"numero":98,"titulo":"Tiempo de uso","seccion":"Funciones nuevas","bd":"Tabla uso_diario (usuario_id, fecha, minutos)","api":"POST /uso suma 1 minuto (ON CONFLICT DO UPDATE); GET /uso/hoy","front":"setInterval que avisa cada minuto y Alert al llegar a 30 minutos"},{"numero":99,"titulo":"Lugares","seccion":"Funciones nuevas","bd":"Tabla lugares (id, nombre, ciudad) y lugar_id en posts","api":"GET /lugares y GET /lugares/{id}/posts; 400 si el lugar no existe","front":"Select de lugar en \"Nuevo post\" y página del lugar con sus posts"},{"numero":100,"titulo":"Comentarios moderados","seccion":"Funciones nuevas","bd":"Tabla comentarios con estado (pendiente, aprobado, rechazado)","api":"Los comentarios nuevos quedan pendientes; PUT /comentarios/{id}/aprobar solo para el autor del post (403); GET público solo trae aprobados","front":"Bandeja \"Comentarios por aprobar\" para el autor"}],"teoria":[{"numero":1,"tema":"POO en C#","pregunta":"¿Qué es una clase y qué es un objeto?","respuesta":"Una clase es el molde que define atributos y métodos; un objeto es una instancia concreta de esa clase, creada con new."},{"numero":2,"tema":"POO en C#","pregunta":"¿Qué es el encapsulamiento?","respuesta":"Ocultar el estado interno (campos privados) y exponerlo solo a través de propiedades o métodos que controlan cómo se lee y se modifica."},{"numero":3,"tema":"POO en C#","pregunta":"¿Cómo se valida un dato en el setter de una propiedad?","respuesta":"En el set se chequea el valor recibido (value) y, si no cumple la regla, se lanza una excepción en vez de asignarlo al campo privado."},{"numero":4,"tema":"POO en C#","pregunta":"¿Qué diferencia hay entre un campo y una propiedad?","respuesta":"El campo es la variable que guarda el dato (normalmente private); la propiedad es el acceso público con get/set que puede validar o calcular."},{"numero":5,"tema":"POO en C#","pregunta":"¿Qué hacen los modificadores public, private y protected?","respuesta":"public: accesible desde cualquier lado. private: solo dentro de la clase. protected: dentro de la clase y de sus clases hijas."},{"numero":6,"tema":"POO en C#","pregunta":"¿Qué es un constructor?","respuesta":"Un método especial con el nombre de la clase que se ejecuta al hacer new para inicializar el objeto; puede sobrecargarse con distintos parámetros."},{"numero":7,"tema":"POO en C#","pregunta":"¿Qué es la herencia y cómo se escribe en C#?","respuesta":"Una clase hija reutiliza atributos y métodos de una clase base. Se declara con dos puntos: class Reel : Publicacion."},{"numero":8,"tema":"POO en C#","pregunta":"¿Para qué sirve la palabra clave base?","respuesta":"Para llamar al constructor o a un método de la clase padre desde la hija, por ejemplo : base(id, autor)."},{"numero":9,"tema":"POO en C#","pregunta":"¿Qué es una clase abstracta?","respuesta":"Una clase que no se puede instanciar y sirve como base; puede tener métodos abstractos (sin cuerpo) que las hijas están obligadas a implementar."},{"numero":10,"tema":"POO en C#","pregunta":"¿Qué diferencia hay entre un método abstract y uno virtual?","respuesta":"abstract no tiene implementación y es obligatorio sobrescribirlo; virtual trae una implementación por defecto que la hija puede reemplazar con override."},{"numero":11,"tema":"POO en C#","pregunta":"¿Qué es una interfaz?","respuesta":"Un contrato que declara métodos y propiedades sin implementación; la clase que la implementa se compromete a definir todos sus miembros."},{"numero":12,"tema":"POO en C#","pregunta":"¿Cuándo conviene una interfaz en vez de una clase abstracta?","respuesta":"Cuando solo hace falta un contrato sin estado ni código compartido, o cuando una clase debe cumplir varios contratos: C# permite implementar muchas interfaces pero heredar de una sola clase."},{"numero":13,"tema":"POO en C#","pregunta":"¿Qué es el polimorfismo?","respuesta":"Que un mismo método se comporte distinto según el tipo real del objeto: una List\u003cPublicacion> puede tener PostFoto y Reel, y cada uno responde a su manera."},{"numero":14,"tema":"POO en C#","pregunta":"¿Qué es una excepción personalizada y cómo se crea?","respuesta":"Una clase propia que hereda de Exception (por ejemplo LikeDuplicadoException) y se lanza con throw cuando se rompe una regla de negocio."},{"numero":15,"tema":"POO en C#","pregunta":"¿Para qué sirve crear excepciones propias en vez de usar Exception a secas?","respuesta":"Permiten reconocer el error concreto en el catch y responder con el código HTTP correcto (409, 403, 429) en vez de un 500 genérico."},{"numero":16,"tema":"POO en C#","pregunta":"¿Qué hacen try, catch y finally?","respuesta":"try encierra el código que puede fallar, catch captura la excepción y la maneja, y finally se ejecuta siempre, haya error o no."},{"numero":17,"tema":"POO en C#","pregunta":"¿Qué pasa si una excepción no se captura en ningún lado?","respuesta":"Sube por la pila de llamadas hasta el framework; en una Minimal API termina en una respuesta 500 Internal Server Error."},{"numero":18,"tema":"POO en C#","pregunta":"¿Qué es un método estático?","respuesta":"Un método que pertenece a la clase y no a una instancia: se llama como Validador.EsEmail(texto) sin hacer new."},{"numero":19,"tema":"POO en C#","pregunta":"¿Qué es un record en C#?","respuesta":"Un tipo pensado para datos inmutables, con igualdad por valor; ideal para DTOs como record CrearPostRequest(int UsuarioId, string Descripcion)."},{"numero":20,"tema":"POO en C#","pregunta":"¿Qué es un DTO y por qué se usa?","respuesta":"Un objeto simple para transportar datos entre la API y el cliente; evita exponer el modelo completo (por ejemplo, la contraseña del usuario)."},{"numero":21,"tema":"POO en C#","pregunta":"¿Qué es la sobrecarga de métodos?","respuesta":"Definir varios métodos con el mismo nombre pero distinta lista de parámetros; el compilador elige cuál llamar según los argumentos."},{"numero":22,"tema":"POO en C#","pregunta":"¿Qué es this?","respuesta":"La referencia al objeto actual. Se usa para distinguir el campo del parámetro (this.nombre = nombre) o para pasar el objeto a otro método."},{"numero":23,"tema":"POO en C#","pregunta":"¿Qué es una List\u003cT> y para qué sirve el genérico T?","respuesta":"Una colección dinámica tipada. T indica el tipo de los elementos (List\u003cPost>), lo que evita conversiones y errores en tiempo de compilación."},{"numero":24,"tema":"POO en C#","pregunta":"¿Qué diferencia hay entre == y Equals para objetos?","respuesta":"Por defecto los dos comparan referencias (si son el mismo objeto), salvo que se sobrescriban; los record comparan por valor."},{"numero":25,"tema":"POO en C#","pregunta":"¿Qué es null y cómo se evita el NullReferenceException?","respuesta":"null es la ausencia de objeto. Se evita validando antes de usar (if (usuario is null) return Results.NotFound()) o con el operador ?. ."},{"numero":26,"tema":"Minimal API","pregunta":"¿Qué es una Minimal API en .NET?","respuesta":"Una forma de crear APIs HTTP con poco código: en Program.cs se arma la app con WebApplication.CreateBuilder y los endpoints con app.MapGet, MapPost, etc."},{"numero":27,"tema":"Minimal API","pregunta":"¿Qué hace WebApplication.CreateBuilder(args)?","respuesta":"Crea el builder donde se registran servicios (CORS, conexión a la base) y configuración; después builder.Build() devuelve la app."},{"numero":28,"tema":"Minimal API","pregunta":"¿Qué hace app.Run()?","respuesta":"Arranca el servidor web (Kestrel) y se queda escuchando peticiones en el puerto configurado hasta que se cierra la aplicación."},{"numero":29,"tema":"Minimal API","pregunta":"¿Qué métodos HTTP se usan para crear, leer, actualizar y borrar?","respuesta":"POST crea, GET lee, PUT (o PATCH) actualiza y DELETE borra; cada uno se mapea con MapPost, MapGet, MapPut y MapDelete."},{"numero":30,"tema":"Minimal API","pregunta":"¿Qué diferencia hay entre PUT y PATCH?","respuesta":"PUT reemplaza el recurso completo; PATCH modifica solo algunos campos."},{"numero":31,"tema":"Minimal API","pregunta":"¿Qué es un parámetro de ruta?","respuesta":"Un valor que viaja en la URL, como {id} en /usuarios/{id}; .NET lo pasa al handler como argumento con el mismo nombre."},{"numero":32,"tema":"Minimal API","pregunta":"¿Qué es un query parameter?","respuesta":"Un dato que va después del ? en la URL (/posts?categoria=Viajes); se recibe como parámetro opcional del handler."},{"numero":33,"tema":"Minimal API","pregunta":"¿Cómo recibe un endpoint el cuerpo JSON de un POST?","respuesta":"Declarando un parámetro de tipo clase o record en el handler; .NET deserializa el JSON automáticamente (model binding)."},{"numero":34,"tema":"Minimal API","pregunta":"¿Qué devuelve Results.Ok(objeto)?","respuesta":"Una respuesta 200 con el objeto serializado a JSON en el cuerpo."},{"numero":35,"tema":"Minimal API","pregunta":"¿Qué código devuelve Results.Created y cuándo se usa?","respuesta":"201 Created. Se usa al crear un recurso con POST, indicando la URL del nuevo recurso y devolviéndolo."},{"numero":36,"tema":"Minimal API","pregunta":"¿Qué significan los códigos 400, 401, 403 y 404?","respuesta":"400 datos inválidos, 401 no autenticado, 403 autenticado pero sin permiso, 404 recurso inexistente."},{"numero":37,"tema":"Minimal API","pregunta":"¿Qué significa el código 409 Conflict?","respuesta":"Que la operación choca con el estado actual: por ejemplo, un username repetido o un like duplicado."},{"numero":38,"tema":"Minimal API","pregunta":"¿Qué códigos corresponden a 423 y 429?","respuesta":"423 Locked (cuenta bloqueada por intentos fallidos) y 429 Too Many Requests (se superó un límite, como 5 posts por día)."},{"numero":39,"tema":"Minimal API","pregunta":"¿Qué devuelve Results.NoContent() y cuándo se usa?","respuesta":"204 sin cuerpo. Es típico al confirmar un DELETE o una actualización que no necesita devolver datos."},{"numero":40,"tema":"Minimal API","pregunta":"¿Qué es CORS y por qué hay que configurarlo?","respuesta":"Un mecanismo del navegador que bloquea peticiones entre orígenes distintos; la API debe permitir al front en localhost:5173 con AddCors y UseCors."},{"numero":41,"tema":"Minimal API","pregunta":"¿Qué es un middleware?","respuesta":"Código que se ejecuta en cada petición antes o después del endpoint (logs, auth, CORS); se encadena con app.Use y llama a next() para continuar."},{"numero":42,"tema":"Minimal API","pregunta":"¿Cómo se lee un header como Authorization en un endpoint?","respuesta":"Desde HttpContext.Request.Headers[\"Authorization\"], verificando antes que exista con ContainsKey o TryGetValue."},{"numero":43,"tema":"Minimal API","pregunta":"¿Para qué sirven async, await y Task en un endpoint?","respuesta":"Permiten esperar operaciones lentas (consultas a la base) sin bloquear el hilo; el handler devuelve Task\u003cIResult> y usa await en cada llamada asíncrona."},{"numero":44,"tema":"Minimal API","pregunta":"¿Cómo se convierte una excepción personalizada en un código HTTP?","respuesta":"Con un try/catch en el endpoint (o un middleware global) que captura la excepción y devuelve Results.Conflict, Results.BadRequest, etc."},{"numero":45,"tema":"Minimal API","pregunta":"¿Qué es la serialización JSON?","respuesta":"Convertir un objeto de C# a texto JSON para enviarlo en la respuesta; la deserialización es el proceso inverso al recibir un cuerpo."},{"numero":46,"tema":"Minimal API","pregunta":"¿Cómo se devuelve un error 400 con un mensaje?","respuesta":"Results.BadRequest(new { error = \"La bio supera los 150 caracteres\" }); el front lo lee de la respuesta y lo muestra en un Alert."},{"numero":47,"tema":"Minimal API","pregunta":"¿Qué es un token de sesión y cómo se valida en la API?","respuesta":"Un identificador (por ejemplo un UUID) que se crea al hacer login y se guarda en la tabla sesiones; cada petición lo manda en el header y la API verifica que exista y no haya vencido."},{"numero":48,"tema":"Minimal API","pregunta":"¿Qué diferencia hay entre autenticación y autorización?","respuesta":"Autenticación es verificar quién sos (login; 401 si falla). Autorización es verificar qué podés hacer (rol admin, dueño del post; 403 si no corresponde)."},{"numero":49,"tema":"Minimal API","pregunta":"¿Por qué nunca se guarda la contraseña en texto plano?","respuesta":"Si la base se filtra quedan expuestas. Se guarda un hash con BCrypt y al loguear se compara con BCrypt.Verify."},{"numero":50,"tema":"Minimal API","pregunta":"¿Cómo se prueba un endpoint sin tener el front?","respuesta":"Con Postman, Thunder Client o curl: se envía el método, la URL, los headers y el cuerpo JSON, y se revisa el código de respuesta."},{"numero":51,"tema":"PostgreSQL","pregunta":"¿Qué es una clave primaria?","respuesta":"La columna (o conjunto de columnas) que identifica de forma única cada fila; no admite nulos ni repetidos. Ejemplo: id SERIAL PRIMARY KEY."},{"numero":52,"tema":"PostgreSQL","pregunta":"¿Qué es una clave foránea?","respuesta":"Una columna que referencia la clave primaria de otra tabla (usuario_id INT REFERENCES usuarios(id)) y garantiza que el valor exista."},{"numero":53,"tema":"PostgreSQL","pregunta":"¿Qué hace ALTER TABLE ... ADD?","respuesta":"Agrega una columna nueva a una tabla existente sin perder los datos: ALTER TABLE usuarios ADD bio VARCHAR(150)."},{"numero":54,"tema":"PostgreSQL","pregunta":"¿Para qué sirve DEFAULT en una columna?","respuesta":"Define el valor que toma la columna si el INSERT no lo indica, por ejemplo es_privada BOOLEAN DEFAULT false."},{"numero":55,"tema":"PostgreSQL","pregunta":"¿Qué hace la restricción UNIQUE?","respuesta":"Impide valores repetidos en la columna; un INSERT duplicado falla y la API puede responder 409."},{"numero":56,"tema":"PostgreSQL","pregunta":"¿Qué hace la restricción CHECK?","respuesta":"Valida una condición en cada fila, por ejemplo CHECK (puntuacion BETWEEN 1 AND 5)."},{"numero":57,"tema":"PostgreSQL","pregunta":"¿Qué diferencia hay entre VARCHAR(n) y TEXT?","respuesta":"VARCHAR(n) limita el largo a n caracteres; TEXT no tiene límite."},{"numero":58,"tema":"PostgreSQL","pregunta":"¿Qué devuelve NOW() y para qué se usa?","respuesta":"La fecha y hora actual del servidor. Se usa en DEFAULT NOW() o para registrar el último login."},{"numero":59,"tema":"PostgreSQL","pregunta":"¿Qué es una clave primaria compuesta?","respuesta":"Una clave formada por varias columnas, como PRIMARY KEY (usuario_id, post_id) en likes, que evita que un usuario repita el like en el mismo post."},{"numero":60,"tema":"PostgreSQL","pregunta":"¿Qué es un JOIN y cuándo se usa?","respuesta":"Combina filas de dos tablas por una columna relacionada; por ejemplo, traer cada post junto con el nombre y la foto de su autor."},{"numero":61,"tema":"PostgreSQL","pregunta":"¿Qué hacen GROUP BY y COUNT?","respuesta":"Agrupan filas por un valor y cuentan cuántas hay en cada grupo: los 5 hashtags más usados salen de GROUP BY hashtag ORDER BY COUNT(*) DESC LIMIT 5."},{"numero":62,"tema":"PostgreSQL","pregunta":"¿Para qué sirven LIMIT y OFFSET?","respuesta":"Para paginar: LIMIT 10 OFFSET 20 devuelve 10 filas salteando las primeras 20 (página 3)."},{"numero":63,"tema":"PostgreSQL","pregunta":"¿Qué diferencia hay entre LIKE e ILIKE?","respuesta":"ILIKE busca ignorando mayúsculas y minúsculas; % es el comodín para cualquier texto."},{"numero":64,"tema":"PostgreSQL","pregunta":"¿Qué es un índice y por qué acelera las consultas?","respuesta":"Una estructura ordenada sobre una columna (CREATE INDEX ON posts(fecha)) que permite buscar y ordenar sin recorrer toda la tabla."},{"numero":65,"tema":"PostgreSQL","pregunta":"¿Qué hace ON CONFLICT DO UPDATE?","respuesta":"Si el INSERT choca con una clave existente, actualiza la fila en vez de fallar (upsert); sirve para cambiar una reacción o sumar minutos de uso."},{"numero":66,"tema":"PostgreSQL","pregunta":"¿Qué es un borrado lógico?","respuesta":"Marcar la fila como eliminada (activo = false o eliminado_en = NOW()) en lugar de hacer DELETE, para poder restaurarla y conservar el historial."},{"numero":67,"tema":"PostgreSQL","pregunta":"¿Qué es NpgsqlConnection?","respuesta":"La clase del driver Npgsql que abre la conexión con PostgreSQL a partir de la connection string (host, base, usuario y contraseña)."},{"numero":68,"tema":"PostgreSQL","pregunta":"¿Qué es NpgsqlCommand?","respuesta":"El objeto que representa una consulta SQL sobre una conexión; se le agregan parámetros y se ejecuta."},{"numero":69,"tema":"PostgreSQL","pregunta":"¿Qué diferencia hay entre ExecuteReaderAsync, ExecuteNonQueryAsync y ExecuteScalarAsync?","respuesta":"Reader devuelve filas (SELECT); NonQuery ejecuta INSERT/UPDATE/DELETE y devuelve las filas afectadas; Scalar devuelve un solo valor (un COUNT o un id con RETURNING)."},{"numero":70,"tema":"PostgreSQL","pregunta":"¿Por qué se usan parámetros (@nombre) en vez de concatenar strings?","respuesta":"Para evitar inyección SQL y problemas con comillas: cmd.Parameters.AddWithValue(\"@email\", email)."},{"numero":71,"tema":"PostgreSQL","pregunta":"¿Qué es la inyección SQL?","respuesta":"Un ataque donde el usuario escribe SQL en un campo (por ejemplo ' OR 1=1 --) y, si se concatena a la consulta, altera o roba datos."},{"numero":72,"tema":"PostgreSQL","pregunta":"¿Qué hace RETURNING en un INSERT?","respuesta":"Devuelve columnas de la fila insertada, típicamente RETURNING id, para no tener que hacer otra consulta."},{"numero":73,"tema":"PostgreSQL","pregunta":"¿Qué pasa si se intenta borrar un usuario que tiene posts con clave foránea?","respuesta":"PostgreSQL rechaza el DELETE por la referencia, salvo que la FK tenga ON DELETE CASCADE o que se borren antes los posts."},{"numero":74,"tema":"PostgreSQL","pregunta":"¿Qué tipo de dato conviene para dinero y por qué?","respuesta":"NUMERIC(10,2): guarda decimales exactos, a diferencia de FLOAT, que tiene errores de redondeo."},{"numero":75,"tema":"PostgreSQL","pregunta":"¿Qué es una transacción?","respuesta":"Un conjunto de operaciones que se confirman todas juntas (COMMIT) o se deshacen (ROLLBACK); evita estados a medias, por ejemplo al crear un post con sus fotos."},{"numero":76,"tema":"React y front","pregunta":"¿Qué es un componente en React?","respuesta":"Una función que recibe props y devuelve JSX; es la unidad reutilizable de la interfaz (Feed, Perfil, PostCard)."},{"numero":77,"tema":"React y front","pregunta":"¿Qué es JSX?","respuesta":"Una sintaxis parecida a HTML dentro de JavaScript que Vite transforma en llamadas a React; permite incrustar expresiones entre llaves {}."},{"numero":78,"tema":"React y front","pregunta":"¿Qué hace useState?","respuesta":"Declara una variable de estado y la función para actualizarla; al cambiarla, el componente se vuelve a renderizar."},{"numero":79,"tema":"React y front","pregunta":"¿Qué hace useEffect y para qué sirve el array de dependencias?","respuesta":"Ejecuta efectos (pedir datos a la API) después del render. El array controla cuándo se repite: [] solo al montar, [id] cada vez que cambia id."},{"numero":80,"tema":"React y front","pregunta":"¿Qué son las props?","respuesta":"Datos que un componente padre pasa a un hijo como atributos; en el hijo son de solo lectura."},{"numero":81,"tema":"React y front","pregunta":"¿Qué es \"levantar el estado\" (lifting state up)?","respuesta":"Mover el estado al componente padre común para que varios hijos lo compartan, pasándolo por props junto con la función que lo cambia."},{"numero":82,"tema":"React y front","pregunta":"¿Qué es un input controlado?","respuesta":"Un input cuyo valor viene del estado (value={bio}) y se actualiza con onChange; permite validar y mostrar contadores como \"x/150\"."},{"numero":83,"tema":"React y front","pregunta":"¿Para qué se usa event.preventDefault() en un formulario?","respuesta":"Para evitar que el navegador recargue la página al enviar y manejar el submit con JavaScript."},{"numero":84,"tema":"React y front","pregunta":"¿Por qué cada elemento de un .map necesita una key?","respuesta":"Para que React identifique cada elemento de la lista y actualice solo lo que cambió; debe ser única y estable, como el id del post."},{"numero":85,"tema":"React y front","pregunta":"¿Qué hacen BrowserRouter, Routes y Route de React Router?","respuesta":"BrowserRouter habilita la navegación por URL, Routes agrupa las rutas y Route asocia una URL con un componente."},{"numero":86,"tema":"React y front","pregunta":"¿Qué diferencia hay entre Link y useNavigate?","respuesta":"Link es un enlace declarativo en el JSX; useNavigate devuelve una función para navegar desde código, por ejemplo después de un login exitoso."},{"numero":87,"tema":"React y front","pregunta":"¿Qué hace useParams?","respuesta":"Devuelve los parámetros de la URL definidos en la ruta, como el id en /perfil/:id."},{"numero":88,"tema":"React y front","pregunta":"¿Qué es Axios y qué ventaja tiene sobre fetch?","respuesta":"Un cliente HTTP que convierte JSON automáticamente, permite una instancia con baseURL y lanza error en códigos 4xx/5xx, lo que simplifica el manejo con try/catch."},{"numero":89,"tema":"React y front","pregunta":"¿Para qué sirve src/api.js con baseURL?","respuesta":"Centraliza la URL del back (axios.create({ baseURL: \"http://localhost:5000\" })) para no repetirla y poder cambiarla en un solo lugar al desplegar."},{"numero":90,"tema":"React y front","pregunta":"¿Qué es un interceptor de Axios?","respuesta":"Una función que se ejecuta antes de cada request o después de cada response; sirve para agregar el header Authorization con el token guardado."},{"numero":91,"tema":"React y front","pregunta":"¿Cómo se guarda la sesión del usuario en el navegador?","respuesta":"Con localStorage.setItem(\"usuario\", JSON.stringify(data)) después del login, leyéndolo al iniciar la app; se borra con removeItem al cerrar sesión."},{"numero":92,"tema":"React y front","pregunta":"¿Cómo se muestra un error de la API en el front?","respuesta":"Capturando el error con try/catch, leyendo error.response.data y mostrándolo en un Alert de MUI con severity=\"error\"."},{"numero":93,"tema":"React y front","pregunta":"¿Qué son los componentes de MUI y cómo se usan?","respuesta":"Componentes de interfaz listos (Button, TextField, Alert, Snackbar) que se importan de @mui/material y se configuran con props."},{"numero":94,"tema":"React y front","pregunta":"¿Cómo se renderiza algo de forma condicional en JSX?","respuesta":"Con && ({esAdmin && \u003cButton>Borrar\u003c/Button>}) o con el operador ternario para elegir entre dos elementos."},{"numero":95,"tema":"React y front","pregunta":"¿Qué hace el spread operator al actualizar el estado?","respuesta":"Copia el objeto o array y cambia solo una parte sin mutar el original: setUsuario({ ...usuario, bio: nuevaBio })."},{"numero":96,"tema":"React y front","pregunta":"¿Por qué no se debe mutar el estado directamente?","respuesta":"React compara referencias: si se modifica el mismo objeto no detecta el cambio y no vuelve a renderizar."},{"numero":97,"tema":"React y front","pregunta":"¿Cómo se implementa un polling cada 5 segundos?","respuesta":"Con setInterval dentro de useEffect que vuelve a pedir los datos, y limpiándolo con clearInterval en la función de retorno del efecto."},{"numero":98,"tema":"React y front","pregunta":"¿Cómo se copia texto al portapapeles desde React?","respuesta":"Con navigator.clipboard.writeText(url); devuelve una promesa, así que conviene usar await y después mostrar un aviso."},{"numero":99,"tema":"React y front","pregunta":"¿Cómo se aplica un filtro visual a una imagen con CSS?","respuesta":"Con la propiedad filter, por ejemplo grayscale(1) para blanco y negro o sepia(1); se puede asignar según el valor guardado del post."},{"numero":100,"tema":"React y front","pregunta":"¿Qué hacen npm run dev y npm run build?","respuesta":"dev levanta el servidor de Vite con recarga en caliente para desarrollar; build genera la carpeta dist optimizada para publicar (por ejemplo en Netlify)."}]};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function group(arr,key){const m=new Map();arr.forEach(c=>{const k=c[key];if(!m.has(k))m.set(k,[]);m.get(k).push(c)});return m}
function cardHTML(kind,c){
  if(kind==='teoria')return `<div class="card teoria" tabindex="0" role="button" aria-pressed="false"><div class="inner"><div class="face front"><span class="num">#${c.numero}</span>${esc(c.pregunta)}<span class="hint">ver respuesta</span></div><div class="face back"><span class="num">#${c.numero} · ${esc(c.tema)}</span><h4>${esc(c.pregunta)}</h4><span>${esc(c.respuesta)}</span></div></div></div>`;
  return `<div class="card ${kind}" tabindex="0" role="button" aria-pressed="false"><div class="inner"><div class="face front"><span class="num">#${c.numero}</span>${esc(c.titulo)}<span class="hint">click para dar vuelta</span></div><div class="face back"><span class="num">#${c.numero} · ${esc(c.seccion)}</span><h4>${esc(c.titulo)}</h4><b>Base de datos</b><span>${esc(c.bd)}</span><b>API</b><span>${esc(c.api)}</span><b>Front</b><span>${esc(c.front)}</span></div></div></div>`;
}
const cats=[['blancas','Blancas','b','seccion'],['negras','Negras','n','seccion'],['teoria','Teoría','t','tema']];
app.innerHTML=cats.map(([k,label,dot,key])=>{
  const g=group(D[k],key);
  return `<section class="cat" id="${k}"><h2><i class="dot ${dot}"></i>${label} <small style="color:var(--mut);font-weight:400">(${D[k].length})</small></h2>`+
   [...g].map(([name,list])=>`<h3>${esc(name)} · ${list.length}</h3><div class="grid">${list.map(c=>cardHTML(k,c)).join('')}</div>`).join('')+`</section>`;
}).join('');
function toggle(el){const f=el.classList.toggle('flip');el.setAttribute('aria-pressed',f)}
app.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)toggle(c)});
app.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const c=e.target.closest('.card');if(c){e.preventDefault();toggle(c)}}});
const setAll=v=>document.querySelectorAll('.card').forEach(c=>{c.classList.toggle('flip',v);c.setAttribute('aria-pressed',v)});
document.getElementById('all').onclick=()=>setAll(true);
document.getElementById('none').onclick=()=>setAll(false);
</script>
</body>
</html>
